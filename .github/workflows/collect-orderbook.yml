name: Collect intraday order book snapshots

on:
  workflow_dispatch:
  schedule:
    # 09:00 Taipei (01:00 UTC), weekdays -- at the opening bell. The
    # script itself polls until ~13:35 Taipei and self-commits along the
    # way, so this only needs to fire once per session.
    - cron: "0 1 * * 1-5"

permissions:
  contents: write

concurrency:
  group: collect-orderbook
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Session is ~4.5h (09:00-13:30 Taipei) + polling/commit overhead;
    # this caps the job well short of GitHub's own 6h hosted-runner limit.
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect order book snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 tools/collect_orderbook_snapshots.py
