# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stamp build version
        # index.html and sw.js both ship with a literal '__BUILD_VERSION__'
        # placeholder that this step is supposed to replace with the short
        # commit SHA — that's what makes the service worker's cache name
        # change on every deploy, which is what makes updates actually take
        # effect on a phone that already has the app installed. This step
        # never existed before, so every deploy since day one shipped the
        # literal placeholder string and the cache name never rotated.
        # Substitutes into a copy under ./dist so the repo's own source
        # files keep the placeholder unmodified.
        run: |
          VERSION="${GITHUB_SHA::7}"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          rsync -a --exclude='dist' --exclude='.git' --exclude='.github' ./ dist/
          sed -i "s/__BUILD_VERSION__/${VERSION}/g" dist/index.html dist/sw.js
          printf '{"version":"%s","builtAt":"%s"}\n' "$VERSION" "$BUILT_AT" > dist/version.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
