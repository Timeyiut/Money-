# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch. Note: this only fires for
  # pushes made with a real user/PAT identity. GitHub does not fire push
  # events for commits made by the built-in GITHUB_TOKEN (anti-loop
  # protection) -- which is exactly how every data-fetch workflow below
  # commits its results. Without the workflow_run trigger underneath,
  # every one of those data updates landed in the repo but never actually
  # got redeployed to Pages -- confirmed by comparing this workflow's run
  # history against those workflows' commit timestamps, none of their
  # auto-commits appear as a trigger here.
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Redeploy whenever any data-fetch workflow finishes, since their
  # GITHUB_TOKEN commits above don't trigger the push event.
  workflow_run:
    workflows:
      - "Fetch stock prices"
      - "Measure watchlist momentum"
      - "Backtest 00919 dividend strategies"
      - "Backtest 00631L MA crossover signals"
      - "Fetch bank e-statements"
      - "Fetch price history for scenario practice"
    types: [completed]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    # For workflow_run, only redeploy if the triggering run actually
    # succeeded and produced a commit -- a failed data fetch shouldn't
    # spin up a pointless deploy. Push/workflow_dispatch runs don't have
    # a conclusion yet at trigger time, so always proceed for those.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run doesn't check out the triggering run's commit by
          # default -- pin explicitly so a data-fetch's own commit is what
          # actually gets deployed, not whatever main was at when this
          # workflow file was last edited.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stamp build version
        # index.html and sw.js both ship with a literal '__BUILD_VERSION__'
        # placeholder that this step is supposed to replace with the short
        # commit SHA — that's what makes the service worker's cache name
        # change on every deploy, which is what makes updates actually take
        # effect on a phone that already has the app installed. This step
        # never existed before, so every deploy since day one shipped the
        # literal placeholder string and the cache name never rotated.
        # Substitutes into a copy under ./dist so the repo's own source
        # files keep the placeholder unmodified.
        env:
          # $GITHUB_SHA alone is wrong for workflow_run events -- it's this
          # workflow file's own commit, not the triggering run's, and would
          # print a stale version even though the checked-out *files* above
          # are correctly pinned to the triggering commit.
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          VERSION="${DEPLOY_SHA::7}"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          rsync -a --exclude='dist' --exclude='.git' --exclude='.github' ./ dist/
          sed -i "s/__BUILD_VERSION__/${VERSION}/g" dist/index.html dist/sw.js
          printf '{"version":"%s","builtAt":"%s"}\n' "$VERSION" "$BUILT_AT" > dist/version.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
