name: Fetch stock prices

on:
  schedule:
    # 14:30 Taipei (06:30 UTC), weekdays only — after TWSE close
    - cron: "30 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices
        run: python3 tools/fetch_prices.py

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update stock prices"
            git push
          fi
