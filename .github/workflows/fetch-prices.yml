name: Fetch stock prices

on:
  schedule:
    # 13:45 Taipei (05:45 UTC), weekdays — 15 min after the 13:30 bell.
    # Primary source is now Yahoo's chart API (tools/fetch_prices.py),
    # which carries the live/closing tick directly rather than waiting for
    # an end-of-day bulk file, so this run is expected to land the actual
    # close, not yesterday's.
    - cron: "45 5 * * 1-5"
    # 21:00 Taipei (13:00 UTC) — backup pass. Catches cases where the
    # 13:45 run hit a transient failure, or where a source revises its
    # number later in the day (dividend/split adjustments).
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices
        run: python3 tools/fetch_prices.py

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update stock prices"
            git push
          fi
