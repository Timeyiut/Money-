name: Fetch stock prices

on:
  schedule:
    # 16:00 Taipei (08:00 UTC), weekdays only. Market closes 13:30 but the
    # exchanges' after-hours files land ~15:00-16:00, so the old 14:30 run
    # was often reading the *previous* day's close.
    - cron: "0 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices
        run: python3 tools/fetch_prices.py

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update stock prices"
            git push
          fi
