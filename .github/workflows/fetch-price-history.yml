name: Fetch price history for scenario practice

on:
  workflow_dispatch:
  schedule:
    # Weekly, Sunday 22:00 Taipei (14:00 UTC Sat) -- this only needs to
    # stay roughly current for practice variety, not daily-fresh like the
    # holdings price fetch.
    - cron: "0 14 * * 6"

permissions:
  contents: write

concurrency:
  group: fetch-price-history
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch price history
        run: python3 tools/fetch_price_history.py

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/price_history.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update price history for scenario practice"
            git push
          fi
