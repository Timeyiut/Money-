name: Backtest 00919 dividend strategies

on:
  workflow_dispatch:
    inputs:
      debug_dump:
        description: "Print raw TWSE dividend-table response instead of running the backtest"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run backtest
        env:
          DEBUG_DUMP: ${{ inputs.debug_dump && '1' || '' }}
        run: python3 tools/backtest_00919.py

      - name: Commit result
        if: ${{ !inputs.debug_dump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/backtest_00919.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update 00919 backtest results"
            git push
          fi
