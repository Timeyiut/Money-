name: Backtest 6-condition momentum screen (top 50 by trading value)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run backtest
        run: python3 tools/backtest_momentum_screen_top50.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/backtest_momentum_screen_top50.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update top-50 momentum screen backtest"
            git push
          fi
