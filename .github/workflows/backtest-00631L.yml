name: Backtest 00631L MA crossover signals

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run backtest
        run: python3 tools/backtest_00631L.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/backtest_00631L.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update 00631L crossover backtest"
            git push
          fi
